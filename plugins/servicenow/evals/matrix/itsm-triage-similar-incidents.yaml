instructions_must_contain:
  - servicenow__similar_incidents
  - servicenow__search_knowledge
  - by its number
  - only when a published fix exists
  - itsm_triage_markdown
answer_must_contain: [CHG0003311, KB0010042, MTU]
answer_must_not_contain: [comment sent, comment posted]
answer_sections: ["## Findings", "## Proposed classification", "## Proposed actions", "## Confidence"]
min_score: 1.0
