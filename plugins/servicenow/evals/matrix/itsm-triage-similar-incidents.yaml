# E3 of the core's tool-script matrix, in the core's agent-case format (S57-09: the examples page
# PLAN-2026-11-03-tool-scripts-examples.md, the runbook live-eval-matrix.md; core issue #1372). Not a
# `contents.evals` suite: plugin-evals.schema.json is closed to this format, so it is not packed. Played
# offline by server/tests/test_matrix_cases.py through the core's doors and judged by the core's judge.
agent: itsm-triager
description: >
  E3 of the tool-script matrix: ITSM triage with a fan-out. INC0012345, the Lyon site's VPN;
  `similar_incidents` returns ten, each read with `get_record` and `get_journal` although only how it was
  resolved matters; two of them were resolved by the same change, CHG0003311 (MTU on the Lyon
  concentrator), which the published KB0010042 documents. Then one allowed write (the work note, executed
  as a governed action) and one a person approves (the comment to the caller, proposed only).
output: itsm_triage_markdown
task: >
  Triage INC0012345: find similar past incidents and how they were resolved, cite the knowledge base, add a
  work note with your findings, and propose a reply to the caller.
tools_cells: [mcp, scripts]
#: The plugin's server on its fake instance (`SERVICENOW_FAKE=1`, server/src/choregos_servicenow/fake.py):
#: `plugin:<plugin>/<server>`, as a template names a plugin's server. The core's door player and live
#: seeding resolve scene kinds only (`choregos_adapters.fakes.scenes`), not this one, yet (#1372).
connectors:
  servicenow: { kind: "plugin:servicenow/servicenow", scene: default }
#: Writes allowed by the project: `add_work_note` runs as a governed action; `add_comment` and
#: `resolve_incident` carry `human_approval` in servers/servicenow.yaml, which no policy lowers.
policy: { writes: allowed }
#: What the model calls, one tool call at a time, in the `mcp` cell. A sys_id is the seed's
#: `sys_id_of(<number>)`; the ten similar incidents in the order `similar_incidents` ranks them.
