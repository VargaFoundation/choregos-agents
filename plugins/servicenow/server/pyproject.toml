[project]
name = "choregos-servicenow"
version = "0.1.0"
description = "MCP server for ServiceNow (Table API), governed by Choregos."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Varga Foundation" }]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.scripts]
choregos-servicenow = "choregos_servicenow.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.14",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_servicenow"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# The seed is data laid out as tables.
"src/choregos_servicenow/fake.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
