# SPDX-License-Identifier: Apache-2.0
# The network operations agent of the core's built-in catalogue (ADR 0040, ADR 0052), as a plugin (A-03).
# It reads the organisation's pfSense, Cilium/Hubble and nginx connectors; every change it proposes is code.
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: netops
  version: 1.2.0
  publisher: Varga Foundation
  license: Apache-2.0
  description: >-
    Diagnoses network behaviour from flows, network policies, firewall rules and reverse-proxy
    configuration, through the organisation's pfSense, Cilium and nginx connectors, and proposes
    every change as code that a person approves; it never applies one.
  homepage: https://github.com/VargaFoundation/choregos-agents
  # 1.1.0: the agent makes tool scripts its default (`spec.tools`, ADR 0122 §9), a field the core knows
  # from 0.24.1 (S57-15). An older core refuses an agent spec field it does not know, so it must never
  # install this version: it keeps 1.0.0. (1.0.0 needed 0.21.0, the first release that installs plugins.)
  # 1.2.0: every agent declares its five components (ADR 0127, S60-04): `model`, `tools.catalogue|extensions|web`,
  # `memories`. An older core refuses the spec fields it does not know, so it keeps the previous version; the
  # first core release with them (S60-01) is the one after 0.24.8.
  core: ">=0.24.9,<1.0.0"
requires:
  plugins: []
  connectors: {}
  # The organisation's MCP connectors `netops` names in `mcp_servers`, by name.
  org_connectors:
    pfsense: mcp
    cilium: mcp
    nginx: mcp
contents:
  agents:
    - agents/netops.yaml
  evals:
    - evals/netops.yaml
