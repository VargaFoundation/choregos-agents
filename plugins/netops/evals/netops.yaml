agent: netops
description: Diagnoses from flows, policies and firewall rules; proposes every change as
  code through a governed action, never writes to a device or a cluster.
must_contain:
- never write directly to a firewall
- cilium__get_flows
- "verdict: dropped"
- pfsense__list_firewall_rules
- validate_nginx_config
- cilium__propose_network_policy
- nginx__propose_nginx_config
- a person approves
- 'no `fromentities: [all]`'
- "## rollback"
- "\"netops_report_markdown\""
must_not_contain:
- kubectl apply
- you may apply
