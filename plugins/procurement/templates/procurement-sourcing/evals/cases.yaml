# SPDX-License-Identifier: Apache-2.0
# Eval cases of the template `procurement-sourcing`, scored by tests/test_template_evals.py with the
# gates `offer-comparison.yaml` declares: `t-read` for the reader's `offers_structured`, `t-memo` for the
# analyst's `comparison_memo_markdown`. A case is `{id, expect: accept | refuse, why, <output>}`; a refused
# case also names the gate that must refuse it (`fails`) and a word of its reason (`reason_contains`).
# `documents` are the measured documents the gates read as sources. Every name and amount is invented.
documents:
  offers_text:
    files:
    - name: alderbrook-offer.pdf
      type: pdf
      text: 'Alderbrook Supply. Offer for steel brackets. Steel bracket: 25 pc at 500.02 EUR, line total 12500.50
        EUR. Total 12500.50 EUR. Payment in 30 days. Delivery in 14 days. Valid until 2026-12-31. Transport is excluded.'
    - name: brightfield-offer.docx
      type: docx
      text: 'Brightfield Trading. Offer for steel brackets. Steel bracket: 25 pc at 471.20 EUR, line total 11780.00
        EUR. Total 11790.00 EUR. Payment in 45 days. Delivery in 21 days. Installation is excluded.'
  comparison:
    suppliers:
    - name: Brightfield Trading
      currency: EUR
      files:
      - brightfield-offer.docx
      lines_total: 11780.0
      lines_without_total: 0
      line_mismatches: []
      total_mismatch:
        expected: 11780.0
        written: 11790.0
      stated_total: 11790.0
      total: 11790.0
    - name: Alderbrook Supply
      currency: EUR
      files:
      - alderbrook-offer.pdf
      lines_total: 12500.5
      lines_without_total: 0
      line_mismatches: []
      total_mismatch: null
      stated_total: 12500.5
      total: 12500.5
    ranking:
    - rank: 1
      supplier: Brightfield Trading
      total: 11790.0
    - rank: 2
      supplier: Alderbrook Supply
      total: 12500.5
    lowest_total: 11790.0
    highest_total: 12500.5
    spread: 710.5
    spread_ratio: 0.06
  award_basis:
    totals:
      Brightfield Trading: 11790.0
      Alderbrook Supply: 12500.5
    lowest_total: 11790.0
    highest_total: 12500.5
    spread: 710.5
    mismatches:
    - supplier: Brightfield Trading
      kind: stated_total
      expected: 11780.0
      written: 11790.0
