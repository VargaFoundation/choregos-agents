memo:
- id: clean-memo
  expect: accept
  why: Seven sections in order; every amount as comparison writes it; every number of the award basis is written.
  memo: |
    ## Summary
    Brightfield Trading ranks first at 11790.00 EUR, then Alderbrook Supply at 12500.50 EUR. The spread is 710.50 EUR.

    ## Files read
    - alderbrook-offer.pdf: Alderbrook Supply.
    - brightfield-offer.docx: Brightfield Trading.
    - No file is left without a supplier.

    ## Price comparison
    | Rank | Supplier | Total (EUR) |
    |:--|:--|--:|
    | 1 | Brightfield Trading | 11790.00 |
    | 2 | Alderbrook Supply | 12500.50 |

    The spread between the highest and the lowest total is 710.50 EUR.

    ## Differences and exclusions
    - Alderbrook Supply: payment in 30 days, delivery in 14 days; "Transport is excluded".
    - Brightfield Trading: payment in 45 days, delivery in 21 days; "Installation is excluded".

    ## Checks that failed
    - Brightfield Trading, stated_total: the lines add up to 11780.00 EUR, the offer writes 11790.00 EUR.

    ## Questions for the suppliers
    - Brightfield Trading: which of 11780.00 EUR and 11790.00 EUR is the total of the offer?
    - Alderbrook Supply: what would transport cost?

    ## What this memo does not cover
    Quality, references and financial standing. The award is a person's decision.
