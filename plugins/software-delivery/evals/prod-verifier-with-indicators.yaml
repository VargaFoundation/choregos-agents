agent: prod-verifier
description: 'An indicator source is configured: before/after figures are required, no-go when in doubt.'
production_indicators: [grafana]
must_contain:
- read-only
- 'production indicator sources configured for this project: grafana'
- before and after the release
- errors, latency, business errors
- no-go
- smoke_
- '"verdict"'
must_not_contain:
- none configured for this project
- only the smoke test was available
