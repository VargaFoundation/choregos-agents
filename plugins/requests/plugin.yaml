# SPDX-License-Identifier: Apache-2.0
# The agents of the core's `default-request` workflow (ADR 0110), the workflow a project without a repository
# receives: one writes the brief a person approves, the other produces the deliverable it asks for. Their
# instructions are the core's `brief` and `deliver` playbooks (VargaFoundation/choregos#1091).
apiVersion: choregos/v1
kind: Plugin
metadata:
  name: requests
  version: 1.1.0
  publisher: Varga Foundation
  license: Apache-2.0
  description: >-
    Agents for requests from any trade, with no repository: one turns a request into a brief a person
    approves (need, expected deliverable, acceptance criteria, out of scope, sources); the other produces
    the deliverable the approved brief asks for, citing its sources, and a person accepts it or sends it
    back.
  homepage: https://github.com/VargaFoundation/choregos-agents
  # 1.0.1 admits 0.21.0: a core built from main after that release reports 0.21.0 and already runs
  # `default-request`. On the 0.21.0 release itself, which has neither the workflow nor the `brief` and
  # `deliver` playbooks, the agents install and wait unused: a catalogue role is a label there.
  # 1.1.0: every agent declares its five components (ADR 0127, S60-04): `model`, `tools.catalogue|extensions|web`,
  # `memories`. An older core refuses the spec fields it does not know, so it keeps the previous version; the
  # first core release with them (S60-01) is the one after 0.24.8.
  core: ">=0.24.9,<1.0.0"
requires:
  plugins: []
  connectors: {}
contents:
  agents:
    - agents/assistant.yaml
    - agents/brief-writer.yaml
  evals:
    - evals/assistant.yaml
    - evals/assistant-sent-back.yaml
    - evals/brief-writer.yaml
