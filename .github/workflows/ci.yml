name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The core whose validator, packer, eval matrix and publication library every job runs: the commit of
  # the tag v0.23.5. Its schemas accept `contents.matrix_cases` and a server's `fake` (since v0.23.2,
  # VargaFoundation/choregos#1417). publish.yml pins the same commit.
  CHOREGOS_REF: ed0351e3255e5483c4f3f5080f2f5a18e2bf6580

jobs:
  servers:
    # Each plugin that ships a server: its own lint, types and tests, in fake mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: test every server
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in plugins/*/server; do
            [ -f "$dir/pyproject.toml" ] || continue
            found=1
            echo "::group::$dir"
            (cd "$dir" && uv sync --all-extras --dev \
              && uv run ruff check . && uv run ruff format --check . \
              && uv run mypy --strict src && uv run pytest -q)
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no server yet"

  plugins:
    # Every plugin through the core's own validator and packer (ADR 0093): manifest, agents, skills,
    # templates, evals, procedures, servers; then `pack` twice must give the same bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: VargaFoundation/choregos
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: validate and pack every plugin
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen --package choregos-cli
          out="$RUNNER_TEMP/packs"
          mkdir -p "$out"
          found=0
          for dir in "$GITHUB_WORKSPACE"/agents/plugins/*/; do
            [ -f "$dir/plugin.yaml" ] || continue
            found=1
            name=$(basename "$dir")
            echo "::group::$name"
            uv run --frozen --package choregos-cli choregos plugin validate "$dir"
            uv run --frozen --package choregos-cli choregos plugin pack "$dir" -o "$out/$name-1.tar.gz"
            uv run --frozen --package choregos-cli choregos plugin pack "$dir" -o "$out/$name-2.tar.gz"
            cmp "$out/$name-1.tar.gz" "$out/$name-2.tar.gz" || { echo "::error::$name: pack is not reproducible"; exit 1; }
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no plugin yet"

  matrix:
    # The ServiceNow plugin's matrix cases (`contents.matrix_cases`, the core's agent-case format), played
    # as the core's scripted eval matrix plays them: found in this tree's plugins as its offline plugins,
    # each played in its cells through the core's real doors against the server in-process on its fake
    # (registered with the core's `use_fake_plugin_server`), and judged by the core's case judge. Needs
    # the core's whole workspace (the orchestrator's door player, the playbooks' judge, the runner's
    # generated client) and the server's source on the path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: VargaFoundation/choregos
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: play and judge the matrix cases
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen
          PYTHONPATH="$GITHUB_WORKSPACE/agents/plugins/servicenow/server/src" \
            uv run --frozen pytest -q -p no:cacheprovider \
            "$GITHUB_WORKSPACE/agents/plugins/servicenow/server/tests/test_matrix_cases.py"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --exit-code 1 --no-banner

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit carries a Signed-off-by
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          tip='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit without Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$base..$tip")"
          [ "$missing" -eq 0 ] || { echo "$missing unsigned commit(s): git rebase --signoff $base"; exit 1; }

  publication:
    # scripts/publish.py, which publish.yml runs on main only: its tests against an in-memory registry,
    # then every plugin of the tree staged, packed and indexed offline (no registry, docker nor cosign).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: VargaFoundation/choregos
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: publish, tested and dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen --package choregos-cli
          uv run --frozen --package choregos-cli --with pytest pytest -q "$GITHUB_WORKSPACE/agents/scripts/tests"
          uv run --frozen --package choregos-cli python "$GITHUB_WORKSPACE/agents/scripts/publish.py" \
            "$GITHUB_WORKSPACE/agents/plugins" --registry ghcr.io/vargafoundation/choregos-agents --offline

  ci-ok:
    needs: [servers, plugins, matrix, secrets, dco, publication]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job succeeded or was skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          ! echo "$results" | grep -o '"result": "[a-z_]*"' | grep -qvE '"result": "(success|skipped)"'
