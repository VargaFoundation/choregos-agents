name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The core whose validator, packer, eval matrix and publication library every job runs: a main commit of
  # graalsystems/tranibor, after the rename to Tranibor (ADR 0176). publish.yml pins the same commit.
  # TEMPORARY, integration branch of the procurement plugin only (core PLAN-2026-11-20-procurement §4):
  # a commit of the core's branch that carries metadata.attachments, the reserved input and the gate
  # output_sections, and the job commands of lot 2 (S85-03 to S85-15). Story PA-04 moves this and publish.yml together to the release that ships them.
  CHOREGOS_REF: 3327e2b3bd80d9012f1aecbfb7ae5df462bb1320

jobs:
  servers:
    # Each plugin that ships a server: its own lint, types and tests, in fake mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: test every server
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in plugins/*/server; do
            [ -f "$dir/pyproject.toml" ] || continue
            found=1
            echo "::group::$dir"
            (cd "$dir" && uv sync --all-extras --dev \
              && uv run ruff check . && uv run ruff format --check . \
              && uv run mypy --strict src && uv run pytest -q)
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no server yet"

  plugins:
    # Every plugin through the core's own validator and packer (ADR 0093): manifest, agents, skills,
    # templates, evals, procedures, servers; then `pack` twice must give the same bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: graalsystems/tranibor
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: validate and pack every plugin
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen --package tranibor-cli
          out="$RUNNER_TEMP/packs"
          mkdir -p "$out"
          found=0
          for dir in "$GITHUB_WORKSPACE"/agents/plugins/*/; do
            [ -f "$dir/plugin.yaml" ] || continue
            found=1
            name=$(basename "$dir")
            echo "::group::$name"
            uv run --frozen --package tranibor-cli tranibor plugin validate "$dir"
            uv run --frozen --package tranibor-cli tranibor plugin pack "$dir" -o "$out/$name-1.tar.gz"
            uv run --frozen --package tranibor-cli tranibor plugin pack "$dir" -o "$out/$name-2.tar.gz"
            cmp "$out/$name-1.tar.gz" "$out/$name-2.tar.gz" || { echo "::error::$name: pack is not reproducible"; exit 1; }
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no plugin yet"

  matrix:
    # The matrix cases of every plugin whose server ships `tests/test_matrix_cases.py` (`contents.matrix_cases`,
    # the core's agent-case format; one pytest per plugin), played as the core's scripted eval matrix plays them: found in this tree's plugins as its offline plugins,
    # each played in its cells through the core's real doors against the server in-process on its fake
    # (registered with the core's `use_fake_plugin_server`), and judged by the core's case judge. Needs
    # the core's whole workspace (the orchestrator's door player, the playbooks' judge, the runner's
    # generated client) and the server's source on the path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: graalsystems/tranibor
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: play and judge the matrix cases
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen
          found=0
          for file in "$GITHUB_WORKSPACE"/agents/plugins/*/server/tests/test_matrix_cases.py; do
            [ -f "$file" ] || continue
            found=1
            server="${file%/tests/test_matrix_cases.py}"
            echo "::group::$server"
            PYTHONPATH="$server/src" uv run --frozen pytest -q -p no:cacheprovider "$file"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "::error::no plugin ships matrix cases"; exit 1; }

  templates:
    # The template of the procurement plugin keeps its guarantees: its workflow parsed by the core and its
    # gates asserted by name and parameters, and its eval cases played through the core's real gates
    # (`plugins/*/tests`, run from the core checkout, one pytest per plugin). Removing a guarantee from
    # a workflow file turns this job red before the core ships the archive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: graalsystems/tranibor
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: structure tests and eval cases
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen
          found=0
          for dir in "$GITHUB_WORKSPACE"/agents/plugins/*/tests; do
            [ -d "$dir" ] || continue
            found=1
            echo "::group::$dir"
            PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest -q -p no:cacheprovider "$dir"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no template tests yet"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --exit-code 1 --no-banner

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit carries a Signed-off-by
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          tip='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit without Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$base..$tip")"
          [ "$missing" -eq 0 ] || { echo "$missing unsigned commit(s): git rebase --signoff $base"; exit 1; }

  publication:
    # scripts/publish.py, which publish.yml runs on main only: its tests against an in-memory registry,
    # then every plugin of the tree staged, packed and indexed offline (no registry, docker nor cosign).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agents }
      - uses: actions/checkout@v4
        with:
          repository: graalsystems/tranibor
          ref: ${{ env.CHOREGOS_REF }}
          path: core
      - uses: astral-sh/setup-uv@v6
      - name: publish, tested and dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd core
          uv sync --frozen --package tranibor-cli
          uv run --frozen --package tranibor-cli --with pytest pytest -q "$GITHUB_WORKSPACE/agents/scripts/tests"
          uv run --frozen --package tranibor-cli python "$GITHUB_WORKSPACE/agents/scripts/publish.py" \
            "$GITHUB_WORKSPACE/agents/plugins" --registry ghcr.io/graalsystems/tranibor-agents --offline

  ci-ok:
    needs: [servers, plugins, matrix, templates, secrets, dco, publication]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job succeeded or was skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          ! echo "$results" | grep -o '"result": "[a-z_]*"' | grep -qvE '"result": "(success|skipped)"'
