name: publish

# Every plugin whose `metadata.version` is not yet in the registry: its server images built, pushed and
# signed, the plugin packed with their digests, pushed as an OCI artifact and signed, then the index of
# every published version pushed and signed (CONTRIBUTING.md, "Publishing"). Signatures are keyless:
# the identity a deployment trusts is this file on main,
#   https://github.com/VargaFoundation/choregos-agents/.github/workflows/publish.yml@refs/heads/main
# with the issuer https://token.actions.githubusercontent.com (README.md, "Installing").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, none cancelled: the index is read, extended and pushed by each.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/vargafoundation/choregos-agents
  # The core whose `choregos plugin` validates and packs; the same commit as ci.yml.
  CHOREGOS_REF: 3156d12eabb7dc11fd54d821604cb1efb0033b04
  # The cosign release the core's API verifies with (docker/api.Dockerfile).
  COSIGN_RELEASE: v3.1.3
  ORAS_VERSION: 1.3.1

jobs:
  publish:
    # A manual run from another branch would sign with an identity no deployment trusts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push images and plugins to ghcr.io
      id-token: write # cosign keyless: the workflow's OIDC token is the signing identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: agents, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VargaFoundation/choregos
          ref: ${{ env.CHOREGOS_REF }}
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "${{ env.COSIGN_RELEASE }}" }
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with: { version: "${{ env.ORAS_VERSION }}" }
      # docker, oras and cosign all read the credentials this writes (~/.docker/config.json).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the core's CLI
        working-directory: core
        run: uv sync --frozen --package choregos-cli
      - name: publish what is not published, then the index
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --package choregos-cli python "$GITHUB_WORKSPACE/agents/scripts/publish.py" \
            "$GITHUB_WORKSPACE/agents/plugins" \
            --registry "$REGISTRY" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --work "$RUNNER_TEMP/publish"
      - name: the index verifies as a deployment verifies it
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REGISTRY/index@$(oras resolve "$REGISTRY/index:latest")" > /dev/null
          echo "index signed by publish.yml@refs/heads/main"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publish
          path: ${{ runner.temp }}/publish/out
          if-no-files-found: ignore
